{{- if eq .Values.agent.authMode "in_cluster" }}
{{- if and .Values.agent.persistence.enabled (eq .Values.agent.persistence.type "hostPath") (not .Values.agent.nodeSelector) }}
{{- fail "agent.persistence.type=hostPath requires agent.nodeSelector to pin the pod to the node holding the persisted /etc/salt/pki data" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: salt-minion-kubernetes
  namespace: {{ .Values.namespace }}
  labels:
    app: salt-minion-kubernetes
    app.kubernetes.io/name: salt-minion-kubernetes
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.agent.replicas }}
  selector:
    matchLabels:
      app: salt-minion-kubernetes
  template:
    metadata:
      labels:
        app: salt-minion-kubernetes
        app.kubernetes.io/name: salt-minion-kubernetes
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.agent.podSecurityContext | nindent 8 }}
      {{- $needFixPkiPerms := and .Values.agent.persistence.enabled .Values.agent.initContainers.fixPkiPerms.enabled }}
      {{- if or (not .Values.agent.kubectl.bundled) $needFixPkiPerms }}
      initContainers:
        {{- if not .Values.agent.kubectl.bundled }}
        - name: install-kubectl
          image: {{ .Values.agent.kubectl.initImage }}
          # curlimages/curl's own image sets USER curl_user (a name, not a
          # number) - Kubernetes' runAsNonRoot check (inherited from
          # agent.podSecurityContext above) can't resolve that without
          # executing code inside the image, and refuses to start the
          # container at all ("cannot verify user is non-root") unless
          # overridden here with the actual numeric uid/gid.
          securityContext:
            runAsUser: 100
            runAsGroup: 101
          command:
            - sh
            - -c
            - |
              curl -fsSL "https://dl.k8s.io/release/{{ .Values.agent.kubectl.version }}/bin/linux/amd64/kubectl" \
                -o /tools/kubectl && chmod +x /tools/kubectl
          volumeMounts:
            - name: tools
              mountPath: /tools
        {{- end }}
        {{- if $needFixPkiPerms }}
        - name: fix-pki-perms
          image: {{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}
          command: ["chown", "-R", "salt:salt", "/etc/salt/pki"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: pki
              mountPath: /etc/salt/pki
        {{- end }}
      {{- end }}
      containers:
        - name: salt-minion
          image: {{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          env:
            - name: SALT_MASTER
              value: {{ .Values.agent.saltMasterHost | quote }}
            - name: SALT_MASTER_PORT
              value: {{ .Values.agent.saltMasterPort | quote }}
            - name: SALT_PUBLISH_PORT
              value: {{ .Values.agent.saltPublishPort | quote }}
            - name: SALT_AUTH_TIMEOUT
              value: {{ .Values.agent.authTimeout | quote }}
            - name: SALT_MASTER_ALIVE_INTERVAL
              value: {{ .Values.agent.masterAliveInterval | quote }}
            - name: SALT_RECON_DEFAULT
              value: {{ .Values.agent.reconDefault | quote }}
            - name: SALT_RECON_MAX
              value: {{ .Values.agent.reconMax | quote }}
            - name: SALT_RECON_RANDOMIZE
              value: {{ .Values.agent.reconRandomize | quote }}
            {{- if .Values.agent.minion.id }}
            - name: SALT_MINION_ID
              value: {{ .Values.agent.minion.id | quote }}
            {{- end }}
            - name: SALT_LOG_LEVEL
              value: {{ .Values.agent.logLevel | quote }}
            # Vault integration (saltext.vault) - all optional, disabled
            # unless VAULT_ADDR is set. See values.yaml agent.vault.
            - name: VAULT_ADDR
              value: {{ .Values.agent.vault.addr | quote }}
            - name: VAULT_AUTH_METHOD
              value: {{ .Values.agent.vault.authMethod | quote }}
            - name: VAULT_ROLE_ID
              value: {{ .Values.agent.vault.roleId | quote }}
            - name: VAULT_SECRET_ID
              value: {{ .Values.agent.vault.secretId | quote }}
            - name: VAULT_SECRET_ID_FILE
              value: {{ .Values.agent.vault.secretIdFile | quote }}
            - name: VAULT_TOKEN
              value: {{ .Values.agent.vault.token | quote }}
            - name: VAULT_TOKEN_FILE
              value: {{ .Values.agent.vault.tokenFile | quote }}
            - name: VAULT_SDB_PROFILE
              value: {{ .Values.agent.vault.sdbProfile | quote }}
            {{- if not .Values.agent.kubectl.bundled }}
            - name: PATH
              value: "/opt/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            {{- end }}
          volumeMounts:
            - name: pillar
              mountPath: /srv/pillar
              readOnly: true
            {{- if not .Values.agent.kubectl.bundled }}
            - name: tools
              mountPath: /opt/tools
            {{- end }}
            {{- if .Values.agent.persistence.enabled }}
            - name: pki
              mountPath: /etc/salt/pki
            {{- end }}
          securityContext:
            {{- toYaml .Values.agent.containerSecurityContext | nindent 12 }}
      volumes:
        - name: pillar
          configMap:
            name: salt-minion-kubernetes-pillar
        {{- if not .Values.agent.kubectl.bundled }}
        - name: tools
          emptyDir: {}
        {{- end }}
        {{- if .Values.agent.persistence.enabled }}
        - name: pki
          {{- if eq .Values.agent.persistence.type "hostPath" }}
          hostPath:
            path: {{ .Values.agent.persistence.hostPath.path }}
            type: DirectoryOrCreate
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.agent.persistence.pvc.existingClaim | default "salt-minion-kubernetes-pki" }}
          {{- end }}
        {{- end }}
{{- end }}
