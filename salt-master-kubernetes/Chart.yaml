apiVersion: v2
name: salt-master-kubernetes
description: >
  Installs a Salt master as a Kubernetes StatefulSet, supporting Salt's
  native multi-master mode for active-active horizontal scaling (all
  replicas share one pre-seeded keypair; see
  https://docs.saltproject.io/en/3006/topics/tutorials/multimaster.html).
  Exposed via a flat Service, a headless Service (in-cluster per-ordinal
  DNS), and optionally one NodePort Service per replica (external
  per-ordinal access) for minions that run outside normal pod scheduling
  (see scripts/push-image-to-nodes.sh). Deliberately minimal: no RBAC and
  no saltext.kubernetes install, since the master never calls the
  Kubernetes API itself -- see docker/salt-master/README.md.
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - salt
  - saltstack
  - kubernetes
maintainers:
  - name: salt-compliance-team
