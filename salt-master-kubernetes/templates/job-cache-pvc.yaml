{{- if .Values.agent.jobCache.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "salt-master-kubernetes.fullname" . }}-job-cache
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: salt-master-kubernetes
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  accessModes:
    - {{ .Values.agent.jobCache.persistence.accessMode }}
  {{- with .Values.agent.jobCache.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.agent.jobCache.persistence.size }}
{{- end }}
