{{- if and (gt (int .Values.agent.replicas) 1) (not .Values.agent.masterKeySecretName) }}
{{- fail "agent.masterKeySecretName is required when agent.replicas > 1 - without it, every replica generates its own independent keypair, and minions would trust a different master identity depending on which pod they happened to connect to. Pre-seed one shared keypair via an existing Secret." }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: salt-master-kubernetes
  namespace: {{ .Values.namespace }}
  labels:
    app: salt-master-kubernetes
    app.kubernetes.io/name: salt-master-kubernetes
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  # Headless Service, not the flat ClusterIP/NodePort one - StatefulSet needs
  # this specifically for the stable per-ordinal DNS names
  # (salt-master-kubernetes-N.salt-master-kubernetes-headless...) that let a
  # minion's multi-master `master:` list address each replica individually.
  # See templates/service-headless.yaml.
  serviceName: salt-master-kubernetes-headless
  replicas: {{ .Values.agent.replicas }}
  selector:
    matchLabels:
      app: salt-master-kubernetes
  template:
    metadata:
      labels:
        app: salt-master-kubernetes
        app.kubernetes.io/name: salt-master-kubernetes
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.agent.podSecurityContext | nindent 8 }}
      {{- if and .Values.agent.jobCache.persistence.enabled .Values.agent.initContainers.fixCachePerms.enabled }}
      initContainers:
        - name: fix-cache-perms
          image: {{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}
          command: ["chown", "-R", "salt:salt", "/var/cache/salt/master/jobs"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: job-cache
              mountPath: /var/cache/salt/master/jobs
      {{- end }}
      containers:
        - name: salt-master
          image: {{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          env:
            - name: SALT_AUTO_ACCEPT
              value: {{ .Values.agent.autoAccept | quote }}
            - name: SALT_PRESENCE_EVENTS
              value: {{ .Values.agent.presenceEvents | quote }}
            {{- if .Values.agent.masterId }}
            - name: SALT_MASTER_ID
              value: {{ .Values.agent.masterId | quote }}
            {{- end }}
            {{- if .Values.agent.masterKeySecretName }}
            - name: SALT_MASTER_PRIVATE_KEY_B64
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agent.masterKeySecretName }}
                  key: private-key-b64
            - name: SALT_MASTER_PUBLIC_KEY_B64
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agent.masterKeySecretName }}
                  key: public-key-b64
            {{- end }}
          ports:
            - name: publish
              containerPort: 4505
            - name: ret
              containerPort: 4506
          {{- if or .Values.agent.jobCache.persistence.enabled .Values.agent.trustedMinions.enabled }}
          volumeMounts:
            {{- if .Values.agent.jobCache.persistence.enabled }}
            - name: job-cache
              mountPath: /var/cache/salt/master/jobs
            {{- end }}
            {{- if .Values.agent.trustedMinions.enabled }}
            # Read-only: this becomes the ONLY way minions get accepted once
            # enabled - salt-key-operator (see ../../salt-key-operator) owns
            # this ConfigMap's data out-of-band, one file per trusted minion
            # ID. Because the mount is read-only, `salt-key -a` no longer
            # works against this master once this is enabled - it would need
            # to write into this same directory. That's intentional: mixing
            # operator-managed and manually-accepted keys across an
            # active-active master tier would mean different replicas
            # disagreeing on who's trusted, exactly the gap this exists to
            # close. minions_pre/ (pending) is unaffected and stays
            # writable - only minions/ (accepted) is replaced.
            - name: trusted-minions
              mountPath: /etc/salt/pki/master/minions
              readOnly: true
            {{- end }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.agent.containerSecurityContext | nindent 12 }}
      {{- if .Values.agent.trustedMinions.enabled }}
      volumes:
        - name: trusted-minions
          configMap:
            name: {{ .Values.agent.trustedMinions.configMapName }}
      {{- end }}
  {{- if .Values.agent.jobCache.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: job-cache
      spec:
        accessModes:
          - {{ .Values.agent.jobCache.persistence.accessMode }}
        {{- with .Values.agent.jobCache.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.agent.jobCache.persistence.size }}
  {{- end }}
