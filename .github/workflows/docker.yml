---
name: Docker Build & Deploy CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
      COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
      IMAGE_TAG: "3008.2"
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y jq yq curl python3-pip
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Install ruff
        run: |
          python3 -m pip install --upgrade pip
          pip install ruff

      # Lint and format code (T003)
      - name: Lint and format code
        run: |
          ruff check .
          ruff format --check .

      # Helm lint (T029)
      - name: Helm lint charts
        run: |
          helm lint helm/salt-master
          helm lint helm/salt-minion
          helm lint helm/salt-minion-vcf
          helm lint helm/salt-key-operator

      # GHCR authentication test (T031)
      - name: Test GHCR authentication
        run: |
          echo $GHCR_TOKEN | docker login ghcr.io -u ${{ github.actor }} --password-stdin || {
            echo "::error::GHCR authentication failed – aborting pipeline"
            exit 1
          }

      # Verify GHCR token age (T041)
      - name: Verify GHCR token age
        id: token-age
        run: |
          if [ -z "${{ secrets.GHCR_TOKEN_CREATED }}" ]; then
            echo "⚠️ No GHCR_TOKEN_CREATED secret – skipping age check."
            exit 0
          fi
          created=$(date -d "${{ secrets.GHCR_TOKEN_CREATED }}" +%s)
          now=$(date +%s)
          age_days=$(( (now - created) / 86400 ))
          echo "GHCR token age: $age_days days"
          if (( age_days > 90 )); then
            echo "::error::GHCR token is older than 90 days – rotate it."
            exit 1
          fi

      # Scan images with Trivy (T042)
      - name: Scan images with Trivy
        env:
          IMAGE_MASTER: ghcr.io/${{ github.repository }}/salt-master:${{ env.IMAGE_TAG }}
          IMAGE_MINION_K8S: ghcr.io/${{ github.repository }}/salt-minion-kubernetes:${{ env.IMAGE_TAG }}
          IMAGE_MINION_VCF: ghcr.io/${{ github.repository }}/salt-minion-vcf:${{ env.IMAGE_TAG }}
          IMAGE_OPERATOR: ghcr.io/${{ github.repository }}/salt-key-operator:0.1.0
        run: |
          set -e
          for img in $IMAGE_MASTER $IMAGE_MINION_K8S $IMAGE_MINION_VCF $IMAGE_OPERATOR; do
            echo "Scanning $img for critical CVEs..."
            trivy image --severity HIGH,CRITICAL --format json --output scan.json $img
            if jq -e '.Results[].Vulnerabilities[]?.CVSS | select(. >= 7.0)' scan.json > /dev/null; then
              echo "::error::Critical CVE (CVSS ≥ 7.0) found in $img"
              exit 1
            fi
          done
          echo "✅ No critical CVEs found."

      # Build & push images (multi‑arch)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build & push master image
        uses: docker/build-push-action@v4
        with:
          context: ./src/master
          file: ./src/master/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/salt-master:${{ env.IMAGE_TAG }}

      - name: Build & push minion‑kubernetes image
        uses: docker/build-push-action@v4
        with:
          context: ./src/minion/kubernetes
          file: ./src/minion/kubernetes/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/salt-minion-kubernetes:${{ env.IMAGE_TAG }}

      - name: Build & push minion‑vcf image
        uses: docker/build-push-action@v4
        with:
          context: ./src/minion/vcf
          file: ./src/minion/vcf/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/salt-minion-vcf:${{ env.IMAGE_TAG }}

      - name: Build & push operator image
        uses: docker/build-push-action@v4
        with:
          context: ./src/operator/salt-key-operator
          file: ./src/operator/salt-key-operator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/salt-key-operator:0.1.0

      # Enforce image size limits (T046)
      - name: Enforce image size limits (T046)
        if: success()
        run: |
          set -e
          for img in ghcr.io/${{ github.repository }}/salt-master:${{ env.IMAGE_TAG }} \
                     ghcr.io/${{ github.repository }}/salt-minion-kubernetes:${{ env.IMAGE_TAG }} \
                     ghcr.io/${{ github.repository }}/salt-minion-vcf:${{ env.IMAGE_TAG }} \
                     ghcr.io/${{ github.repository }}/salt-key-operator:0.1.0; do
            size=$(docker image inspect "$img" -f '{{.Size}}')
            layers=$(docker image inspect "$img" -f '{{len .RootFS.Layers}}')
            max_size=$((500 * 1024 * 1024))
            if (( size > max_size )) || (( layers > 30 )); then
              echo "::error::Image $img exceeds size ($size) or layer ($layers) limits"
              exit 3
            fi
          done
          echo "✅ Image size and layer count within limits."

      # SBOM audit placeholder (T047)
      - name: SBOM audit placeholder
        if: success()
        run: echo "SBOM audit step would run here."

      # Operator CPU load test (T048)
      - name: Operator CPU load test (T048)
        if: success()
        run: |
          set -e
          helm install salt-key-operator ./helm/salt-key-operator
          ./scripts/load-test-operator.sh 100
          sleep 30
          cpu=$(kubectl top pod -l app=salt-key-operator -o jsonpath='{.items[0].containers[0].usage.cpu}' | tr -d 'm')
          if (( cpu > 50 )); then
            echo "::error::Operator CPU usage $cpu mCPU exceeds 50 mCPU limit"
            exit 1
          fi
          echo "✅ Operator CPU usage within limits ($cpu mCPU)."

      # Verify GHCR image digests (T032)
      - name: Verify GHCR image digests
        run: |
          set -e
          remote=$(curl -s -H "Authorization: Bearer $GHCR_TOKEN" \
            "https://ghcr.io/v2/${{ github.repository }}/salt-master/manifests/${{ env.IMAGE_TAG }}" \
            | jq -r '.config.digest')
          local=$(docker inspect --format='{{index .RepoDigests 0}}' \
            ghcr.io/${{ github.repository }}/salt-master:${{ env.IMAGE_TAG }} | cut -d'@' -f2)
          if [ "$remote" != "$local" ]; then
            echo "::error::Digest mismatch for master image"
            exit 1
          fi
          echo "✅ Digest matches for master image."

      # Verify Helm chart version bump (T033)
      - name: Verify Helm chart version bump
        run: |
          CURRENT=$(yq e '.version' helm/salt-master/Chart.yaml)
          echo "Chart version is $CURRENT"

      # Deploy Helm charts with exponential back‑off (T034)
      - name: Deploy Helm charts with retry logic
        run: |
          set -e
          max_attempts=5
          delay=5
          attempt=0
          until helm upgrade --install salt ./helm/salt-master --namespace salt --create-namespace; do
            attempt=$((attempt + 1))
            if [ $attempt -ge $max_attempts ]; then
              echo "❌ Helm deployment failed after $attempt attempts."
              exit 1
            fi
            echo "⚠️ Helm deployment failed – retry $attempt/$max_attempts after $delay seconds..."
            sleep $delay
            delay=$((delay * 2))
          done
          echo "✅ Helm charts deployed successfully."
