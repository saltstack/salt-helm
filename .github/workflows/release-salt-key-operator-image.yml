name: release (salt-key-operator image)

# Tag scheme: salt-key-operator-image/vX.Y.Z -- publishes only the
# salt-key-operator image at version X.Y.Z, independent of the repo's other
# images/charts. See docs/releasing.md.
on:
  push:
    tags:
      - "salt-key-operator-image/v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#salt-key-operator-image/v}" >> "$GITHUB_OUTPUT"
      - name: Verify CHANGELOG.md has an entry for this release
        run: |
          grep -Eq "^#+ salt-key-operator-image/v${{ steps.meta.outputs.version }}$" \
            salt-key-operator/CHANGELOG.md \
            || { echo "No CHANGELOG.md entry for salt-key-operator-image/v${{ steps.meta.outputs.version }}" >&2; exit 1; }
      - uses: docker/build-push-action@v6
        with:
          context: salt-key-operator
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/salt-key-operator:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}/salt-key-operator:latest
