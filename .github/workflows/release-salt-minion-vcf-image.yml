name: release (salt-minion-vcf image)

# Tag scheme: salt-minion-vcf-image/vX.Y.Z -- publishes only the
# salt-minion-vcf image at version X.Y.Z. See docs/releasing.md.
on:
  push:
    tags:
      - "salt-minion-vcf-image/v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#salt-minion-vcf-image/v}" >> "$GITHUB_OUTPUT"
      - name: Verify CHANGELOG.md has an entry for this release
        run: |
          grep -Eq "^#+ salt-minion-vcf-image/v${{ steps.meta.outputs.version }}$" \
            salt-minion-vcf/CHANGELOG.md \
            || { echo "No CHANGELOG.md entry for salt-minion-vcf-image/v${{ steps.meta.outputs.version }}" >&2; exit 1; }
      - uses: docker/build-push-action@v6
        with:
          context: src/minion/vcf
          file: src/minion/vcf/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/salt-minion-vcf:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}/salt-minion-vcf:latest
