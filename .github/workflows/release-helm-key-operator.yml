name: Release Helm - Salt Key Operator

on:
  push:
    tags:
      - 'chart-salt-key-operator-v*'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release-helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Extract Tag Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#chart-operator-v}
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            VERSION="0.0.0-snapshot"
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          REGISTRY_OWNER="${{ github.repository_owner }}"
          echo "registry_owner=${REGISTRY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Inject Chart Version
        run: |
          # Ensure ONLY the clean numeric semver (e.g., 0.1.0) is injected
          CLEAN_VERSION=$(echo "${{ steps.vars.outputs.version }}" | sed -E 's/.*-v?([0-9]+\.[0-9]+\.[0-9]+.*)/\1/')
          
          sed -i "s/^version:.*/version: ${CLEAN_VERSION}/g" helm/salt-minion/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${CLEAN_VERSION}\"/g" helm/salt-minion/Chart.yaml
          
          echo "CLEAN_VERSION=${CLEAN_VERSION}" >> $GITHUB_ENV

      - name: Package Helm Chart
        run: |
          helm package helm/salt-key-operator --destination .dist

      - name: Push Helm Chart OCI Artifact to GHCR
        run: |
          helm push .dist/salt-key-operator-${{env.CLEAN_VERSION}}.tgz oci://ghcr.io/${{ steps.vars.outputs.registry_owner }}//helm

      - name: Create GitHub Release
        if: steps.vars.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Salt Key Operator Helm Release v${{env.CLEAN_VERSION}}"
          body: |
            Automated Helm Chart release for **Salt Key Operator**.
            Install with:
            ```bash
            helm pull oci://ghcr.io/${{ steps.vars.outputs.registry_owner }}//helm/salt-key-operator --version ${{env.CLEAN_VERSION}}
            ```
          draft: false
          prerelease: false

