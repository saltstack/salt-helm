name: CI-CD Pre-Merge Validation

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 1. LINTING ---
      - name: Run Hadolint (Docker Lint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'

      - name: Helm Dependency Update & Lint
        run: |
          # Build salt-key-operator dependency since salt-master relies on it
          helm dependency update helm/salt-master
          
          # Lint all charts
          helm lint helm/salt-key-operator
          helm lint helm/salt-master
          helm lint helm/salt-minion

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' # Adjust version as needed for salt-key-operator

      - name: Go Lint & Validate
        run: |
          if [ -d "src/salt-key-operator" ]; then
            cd src/salt-key-operator
            if [ -f "go.mod" ]; then
              go vec -v ./... || true
              go fmt ./...
              go vet ./...
            fi
          fi

      # --- 2. SUCCESSFUL BUILD DRY-RUNS ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Docker Images (No Push)
        run: |
          docker buildx build --context src/master --file src/master/Dockerfile
          docker buildx build --context src/minion/kubernetes --file src/minion/kubernetes/Dockerfile
          docker buildx build --context src/minion/vcf --file src/minion/vcf/Dockerfile
          docker buildx build --context src/salt-key-operator --file src/salt-key-operator/Dockerfile

      - name: Test Build/Package Helm Charts
        run: |
          mkdir -p dist/
          helm package helm/salt-key-operator -d dist/
          helm package helm/salt-master -d dist/
          helm package helm/salt-minion -d dist/

