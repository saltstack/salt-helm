name: CI-CD Pre-Merge Validation

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 1. VERBOSE LINTING ---
      - name: Run Hadolint (Docker Lint)
        run: |
          echo "🔎 Searching for all Dockerfiles under src/..."
          find src/ -name "Dockerfile" | while read -r dockerfile; do
            echo "--------------------------------------------------"
            echo "📄 Scanning: $dockerfile"
            echo "--------------------------------------------------"
            docker run --rm -i hadolint/hadolint hadolint --verbose - < "$dockerfile"
          done

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'

      - name: Helm Dependency Update & Lint
        run: |
          echo "📦 Building master chart dependencies..."
          helm dependency update helm/salt-master --debug
          
          echo "📊 Linting salt-key-operator chart..."
          helm lint helm/salt-key-operator --debug
          
          echo "📊 Linting salt-master chart..."
          helm lint helm/salt-master --debug
          
          echo "📊 Linting salt-minion chart..."
          helm lint helm/salt-minion --debug

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Go Lint & Validate
        run: |
          if [ -d "src/salt-key-operator" ]; then
            cd src/salt-key-operator
            if [ -f "go.mod" ]; then
              echo "🔎 Running Go validation diagnostics..."
              go fmt ./...
              go vet ./...
            fi
          fi

      # --- 2. FIXED BUILD DRY-RUNS ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Docker Images (No Push)
        run: |
          echo "➡️ Testing Master Image..."
          docker buildx build src/master --file src/master/Dockerfile -t salt-master:test
          
          echo "➡️ Testing Minion Kubernetes Image..."
          docker buildx build src/minion/kubernetes --file src/minion/kubernetes/Dockerfile -t salt-minion-k8s:test
          
          echo "➡️ Testing Minion VCF Image..."
          docker buildx build src/minion/vcf --file src/minion/vcf/Dockerfile -t salt-minion-vcf:test
          
          echo "➡️ Testing Key Operator Image..."
          docker buildx build src/salt-key-operator --file src/salt-key-operator/Dockerfile -t salt-key-operator:test

      - name: Test Build/Package Helm Charts
        run: |
          mkdir -p dist/
          helm package helm/salt-key-operator -d dist/
          helm package helm/salt-master -d dist/
          helm package helm/salt-minion -d dist/

