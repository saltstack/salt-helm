name: release (salt-minion-kubernetes image)

# Tag scheme: salt-minion-kubernetes-image/vX.Y.Z -- publishes only the
# salt-minion-kubernetes image at version X.Y.Z. See docs/releasing.md.
on:
  push:
    tags:
      - "salt-minion-kubernetes-image/v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive version from tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#salt-minion-kubernetes-image/v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: src/minion/kubernetes
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/salt-minion-kubernetes:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}/salt-minion-kubernetes:latest
