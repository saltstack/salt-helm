name: Post-Merge Build & Security Scan

on:
  push:
    branches:
      - main

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 1. VERBOSE LINTING ---
      - name: Run Hadolint (Docker Lint)
        run: |
          echo "🔎 Searching for all Dockerfiles under src/..."
          find src/ -name "Dockerfile" | while read -r dockerfile; do
            echo "--------------------------------------------------"
            echo "📄 Scanning: $dockerfile"
            echo "--------------------------------------------------"
            docker run --rm -i hadolint/hadolint hadolint --verbose - < "$dockerfile"
          done

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm Dependency Update & Lint
        run: |
          echo "📦 Building master chart dependencies..."
          helm dependency update helm/salt-master --debug
          
          echo "📊 Linting salt-key-operator chart..."
          helm lint helm/salt-key-operator --debug
          
          echo "📊 Linting salt-master chart..."
          helm lint helm/salt-master --debug
          
          echo "📊 Linting salt-minion chart..."
          helm lint helm/salt-minion --debug

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Go Vet
        run: |
          if [ -d "src/salt-key-operator" ] && [ -f "src/salt-key-operator/go.mod" ]; then
            cd src/salt-key-operator
            echo "🔎 Running Go validation diagnostics..."
            go vet ./...
          fi

      # --- 2. SETUP DOCKER BUILDX ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- 3. BUILD IMAGES TO LOCAL DAEMON ---
      - name: Build Docker Images Locally
        run: |
          echo "➡️ Building Master Image..."
          docker buildx build src/master --file src/master/Dockerfile --load -t salt-master:local
          
          echo "➡️ Building Minion Kubernetes Image..."
          docker buildx build src/minion/kubernetes --file src/minion/kubernetes/Dockerfile --load -t salt-minion-k8s:local
          
          echo "➡️ Building Minion VCF Image..."
          docker buildx build src/minion/vcf --file src/minion/vcf/Dockerfile --load -t salt-minion-vcf:local
          
          echo "➡️ Building Key Operator Image..."
          docker buildx build src/salt-key-operator --file src/salt-key-operator/Dockerfile --load -t salt-key-operator:local

      # --- 4. TRIVY SECURITY VULNERABILITY SCANS ---
      - name: Scan salt-master image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'salt-master:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan salt-minion-k8s image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'salt-minion-k8s:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan salt-minion-vcf image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'salt-minion-vcf:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan salt-key-operator image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'salt-key-operator:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # --- 5. PACKAGE HELM CHARTS ---
      - name: Package Helm Charts
        run: |
          mkdir -p output-charts/
          helm package helm/salt-key-operator -d output-charts/
          helm package helm/salt-master -d output-charts/
          helm package helm/salt-minion -d output-charts/

      - name: List Local Build Outputs
        run: |
          echo "=== Docker Images Built ==="
          docker images | grep local
          echo "=== Helm Chart Archives ==="
          ls -l output-charts/
