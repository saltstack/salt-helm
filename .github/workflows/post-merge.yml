name: Post-Merge Build & Security Scan

on:
  push:
    branches:
      - main

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 1. RUN ALL CI LINTS ---
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm Dependency Update & Lint
        run: |
          helm dependency update helm/salt-master
          helm lint helm/salt-key-operator
          helm lint helm/salt-master
          helm lint helm/salt-minion

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Go Vet
        run: |
          if [ -d "src/salt-key-operator" ] && [ -f "src/salt-key-operator/go.mod" ]; then
            cd src/salt-key-operator
            go vet ./...
          fi

      # --- 2. SETUP DOCKER BUILDX ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- 3. BUILD IMAGES TO LOCAL DOCKER DAEMON ---
      # We use '--load' so that the locally built images are available for Trivy to scan.
      - name: Build Docker Images Locally
        run: |
          docker buildx build --context src/master --file src/master/Dockerfile --load -t salt-master:local
          docker buildx build --context src/minion/kubernetes --file src/minion/kubernetes/Dockerfile --load -t salt-minion-k8s:local
          docker buildx build --context src/minion/vcf --file src/minion/vcf/Dockerfile --load -t salt-minion-vcf:local
          docker buildx build --context src/salt-key-operator --file src/salt-key-operator/Dockerfile --load -t salt-key-operator:local

      # --- 4. TRIVY SECURITY VULNERABILITY SCANS ---
      - name: Scan salt-master image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'salt-master:local'
          format: 'table'
          exit-code: '1' # Fails the pipeline if vulnerabilities are found
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan salt-minion-k8s image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'salt-minion-k8s:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan salt-minion-vcf image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'salt-minion-vcf:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan salt-key-operator image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'salt-key-operator:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # --- 5. PACKAGE HELM CHARTS ---
      - name: Package Helm Charts
        run: |
          mkdir -p output-charts/
          helm package helm/salt-key-operator -d output-charts/
          helm package helm/salt-master -d output-charts/
          helm package helm/salt-minion -d output-charts/

      - name: List Local Build Outputs
        run: |
          echo "=== Docker Images Built ==="
          docker images | grep local
          echo "=== Helm Chart Archives ==="
          ls -l output-charts/

