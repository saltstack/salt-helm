name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-dockerfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint (salt-master)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/salt-master/Dockerfile
      - name: hadolint (salt-minion-vcf)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: salt-minion-vcf/Dockerfile
      - name: hadolint (salt-minion-vcf dev-master)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: salt-minion-vcf/docker/dev-master/Dockerfile
      - name: hadolint (salt-minion-kubernetes)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: salt-minion-kubernetes/Dockerfile

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck salt-minion-vcf/scripts/*.sh salt-minion-kubernetes/scripts/*.sh

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint (salt-master-kubernetes)
        run: helm lint salt-master-kubernetes
      - name: helm lint (salt-minion-kubernetes)
        run: helm lint salt-minion-kubernetes
      - name: helm lint (salt-minion-vcf)
        run: helm lint salt-minion-vcf/helm/salt-minion-vcf
      - name: helm template (salt-master-kubernetes)
        run: helm template test salt-master-kubernetes
      - name: helm template (salt-minion-kubernetes, bundled kubectl, default)
        run: helm template test salt-minion-kubernetes --set agent.saltMasterHost=salt-master.example.com
      - name: helm template (salt-minion-kubernetes, init-container kubectl)
        run: |
          helm template test salt-minion-kubernetes \
            --set agent.saltMasterHost=salt-master.example.com \
            --set agent.kubectl.bundled=false
      - name: helm template (salt-minion-vcf, StatefulSet, default)
        run: helm template test salt-minion-vcf/helm/salt-minion-vcf --set salt.master=salt-master.example.com
      - name: helm template (salt-minion-vcf, Deployment, single replica)
        run: |
          helm template test salt-minion-vcf/helm/salt-minion-vcf \
            --set salt.master=salt-master.example.com \
            --set workload.kind=Deployment \
            --set workload.replicas=1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build salt-master image (no push)
        uses: docker/build-push-action@v6
        with:
          context: docker/salt-master
          push: false
          tags: salt-master:ci
      - name: Build salt-minion-vcf image (no push)
        uses: docker/build-push-action@v6
        with:
          context: salt-minion-vcf
          push: false
          tags: salt-minion-vcf:ci
      - name: Build salt-minion-kubernetes image (no push)
        uses: docker/build-push-action@v6
        with:
          context: salt-minion-kubernetes
          push: false
          tags: salt-minion-kubernetes:ci
