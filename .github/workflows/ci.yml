name: ci

#on:
#  push:
#    branches: ['**']
#  pull_request:

jobs:
  lint-dockerfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint (salt-master)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/master/Dockerfile
      - name: hadolint (salt-minion-vcf)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/minion/vcf/Dockerfile

      - name: hadolint (salt-minion-kubernetes)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/minion/kubernetes/Dockerfile
      - name: hadolint (salt-key-operator)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: salt-key-operator/Dockerfile

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: salt-key-operator/go.mod
      - name: go vet
        working-directory: salt-key-operator
        run: go vet ./...
      - name: go test
        working-directory: salt-key-operator
        run: go test ./...
      - name: go build
        working-directory: salt-key-operator
        run: go build ./...

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck src/minion/vcf/*.sh src/minion/kubernetes/*.sh src/master/*.sh 

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build chart dependencies
        run: helm dependency build helm/salt-master
      - uses: azure/setup-helm@v4
      - name: helm lint (helm/salt-master)
        run: helm lint helm/salt-master
      - name: helm lint (salt-minion-kubernetes)
        run: helm lint helm/salt-minion
      - name: helm lint (salt-minion-vcf)
        run: helm lint helm/salt-minion
      - name: helm lint (salt-key-operator)
        run: helm lint helm/salt-key-operator

      - name: helm template (salt-key-operator)
        run: helm template test helm/salt-key-operator --include-crds
      - name: helm template (salt-minion-kubernetes, default)
        run: |
          helm template test helm/salt-minion \
            --set agent.saltMasterHost=salt-master.example.com
      - name: helm template (salt-minion-kubernetes, multi-master list)
        run: |
          helm template test helm/salt-minion \
            --set 'agent.saltMasterHost[0]=m0.example.com' \
            --set 'agent.saltMasterHost[1]=m1.example.com' \
            --set 'agent.saltMasterHost[2]=m2.example.com'
      # No failure test for missing keySecretName – the chart provides a default
      - name: helm template (salt-minion-vcf, StatefulSet, default)
        run: |
          helm template test helm/salt-minion \
            --set agent.saltMasterHost=salt-master.example.com
      - name: helm template (salt-minion-vcf, Deployment, single replica)
        run: |
          helm template test helm/salt-minion \
            --set agent.saltMasterHost=salt-master.example.com
      - name: helm template (salt-minion-vcf, multi-master list)
        run: |
          helm template test helm/salt-minion \
            --set 'agent.saltMasterHost[0]=m0.example.com' \
            --set 'agent.saltMasterHost[1]=m1.example.com' \
            --set 'agent.saltMasterHost[2]=m2.example.com'
      # No failure test for missing keySecretName – the chart provides a default

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build salt-master image (no push)
        uses: docker/build-push-action@v6
        with:
          context: src/master
          push: false
          tags: salt-master:ci
      - name: Build salt-minion-vcf image (no push)
        uses: docker/build-push-action@v6
        with:
          context: src/minion/vcf
          push: false
          tags: salt-minion-vcf:ci
      - name: Build salt-minion-kubernetes image (no push)
        uses: docker/build-push-action@v6
        with:
          context: src/minion/kubernetes
          push: false
          tags: salt-minion-kubernetes:ci
      - name: Build salt-key-operator image (no push)
        uses: docker/build-push-action@v6
        with:
          context: salt-key-operator
          push: false
          tags: salt-key-operator:ci
