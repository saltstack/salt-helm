name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-dockerfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint (salt-master)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/salt-master/Dockerfile
      - name: hadolint (salt-minion-vcf)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: salt-minion-vcf/Dockerfile
      - name: hadolint (salt-minion-vcf dev-master)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: salt-minion-vcf/docker/dev-master/Dockerfile
      - name: hadolint (salt-minion-kubernetes)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: salt-minion-kubernetes/Dockerfile
      - name: hadolint (salt-key-operator)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: salt-key-operator/Dockerfile

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: salt-key-operator/go.mod
      - name: go vet
        working-directory: salt-key-operator
        run: go vet ./...
      - name: go test
        working-directory: salt-key-operator
        run: go test ./...
      - name: go build
        working-directory: salt-key-operator
        run: go build ./...

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck salt-minion-vcf/scripts/*.sh salt-minion-kubernetes/scripts/*.sh

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint (salt-master-kubernetes)
        run: helm lint salt-master-kubernetes
      - name: helm lint (salt-minion-kubernetes)
        run: helm lint salt-minion-kubernetes
      - name: helm lint (salt-minion-vcf)
        run: helm lint salt-minion-vcf/helm/salt-minion-vcf
      - name: helm lint (salt-key-operator)
        run: helm lint salt-key-operator/helm/salt-key-operator
      - name: helm template (salt-master-kubernetes, single replica)
        run: helm template test salt-master-kubernetes
      - name: helm template (salt-master-kubernetes, active-active)
        run: |
          helm template test salt-master-kubernetes \
            --set agent.replicas=3 \
            --set agent.masterKeySecretName=my-master-key \
            --set service.perOrdinal.enabled=true
      - name: helm template (salt-master-kubernetes, replicas>1 without masterKeySecretName must fail)
        run: |
          if helm template test salt-master-kubernetes --set agent.replicas=3 >/dev/null 2>&1; then
            echo "expected this render to fail (masterKeySecretName required when replicas>1)" >&2
            exit 1
          fi
      - name: helm template (salt-key-operator)
        run: helm template test salt-key-operator/helm/salt-key-operator --include-crds
      - name: helm template (salt-minion-kubernetes, bundled kubectl, default)
        run: |
          helm template test salt-minion-kubernetes \
            --set agent.saltMasterHost=salt-master.example.com \
            --set agent.minion.keySecretName=my-minion-key
      - name: helm template (salt-minion-kubernetes, init-container kubectl)
        run: |
          helm template test salt-minion-kubernetes \
            --set agent.saltMasterHost=salt-master.example.com \
            --set agent.minion.keySecretName=my-minion-key \
            --set agent.kubectl.bundled=false
      - name: helm template (salt-minion-kubernetes, multi-master list)
        run: |
          helm template test salt-minion-kubernetes \
            --set agent.minion.keySecretName=my-minion-key \
            --set 'agent.saltMasterHost[0]=m0.example.com' \
            --set 'agent.saltMasterHost[1]=m1.example.com' \
            --set 'agent.saltMasterHost[2]=m2.example.com'
      - name: helm template (salt-minion-kubernetes, no keySecretName must fail)
        run: |
          if helm template test salt-minion-kubernetes --set agent.saltMasterHost=x >/dev/null 2>&1; then
            echo "expected this render to fail (agent.minion.keySecretName required unless allowSelfGeneratedKey=true)" >&2
            exit 1
          fi
      - name: helm template (salt-minion-vcf, StatefulSet, default)
        run: |
          helm template test salt-minion-vcf/helm/salt-minion-vcf \
            --set salt.master=salt-master.example.com \
            --set salt.minionKeySecretName=my-minion-key
      - name: helm template (salt-minion-vcf, Deployment, single replica)
        run: |
          helm template test salt-minion-vcf/helm/salt-minion-vcf \
            --set salt.master=salt-master.example.com \
            --set salt.minionKeySecretName=my-minion-key \
            --set workload.kind=Deployment \
            --set workload.replicas=1
      - name: helm template (salt-minion-vcf, multi-master list)
        run: |
          helm template test salt-minion-vcf/helm/salt-minion-vcf \
            --set salt.minionKeySecretName=my-minion-key \
            --set 'salt.master[0]=m0.example.com' \
            --set 'salt.master[1]=m1.example.com' \
            --set 'salt.master[2]=m2.example.com'
      - name: helm template (salt-minion-vcf, no minionKeySecretName must fail)
        run: |
          if helm template test salt-minion-vcf/helm/salt-minion-vcf --set salt.master=x >/dev/null 2>&1; then
            echo "expected this render to fail (minionKeySecretName required unless allowSelfGeneratedKey=true)" >&2
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build salt-master image (no push)
        uses: docker/build-push-action@v6
        with:
          context: docker/salt-master
          push: false
          tags: salt-master:ci
      - name: Build salt-minion-vcf image (no push)
        uses: docker/build-push-action@v6
        with:
          context: salt-minion-vcf
          push: false
          tags: salt-minion-vcf:ci
      - name: Build salt-minion-kubernetes image (no push)
        uses: docker/build-push-action@v6
        with:
          context: salt-minion-kubernetes
          push: false
          tags: salt-minion-kubernetes:ci
      - name: Build salt-key-operator image (no push)
        uses: docker/build-push-action@v6
        with:
          context: salt-key-operator
          push: false
          tags: salt-key-operator:ci
