apiVersion: v2
name: salt-minion
description: >
  Installs RBAC and an optional Salt minion Deployment for running
  CIS Kubernetes compliance assessments via kube-bench on-demand Jobs.
  Supports two modes: in-cluster (Salt minion runs as a pod) and
  external (RBAC only; minion runs outside the cluster).
