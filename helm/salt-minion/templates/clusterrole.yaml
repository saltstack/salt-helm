{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.rbac.roleName }}-nodes
  labels:
    app.kubernetes.io/name: salt-minion
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
{{- if .Values.rbac.fullAccess }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
{{- else }}
rules:
  # nodes is cluster-scoped -- a namespaced Role/RoleBinding (see role.yaml)
  # is never consulted for cluster-scoped resources, regardless of its
  # rules, so kube_bench_cache._create_assessment_job's node-count lookup
  # (kubernetes.nodes) needs a ClusterRole/ClusterRoleBinding instead.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
{{ toYaml .Values.rbac.customClusterRoleRules | nindent 2 }}
{{- end }}
{{- end }}
