# Raw TCP passthrough for the flat Service via a Gateway API TCPRoute
# (e.g. Envoy Gateway) - see service.gateway's own values.yaml comment for
# why this isn't a standard Kubernetes Ingress (Ingress is HTTP(S)-only;
# Salt's 4505/4506 are raw ZeroMQ, not HTTP). Disabled by default. Expects
# a Gateway (created separately, outside this chart) with two TCP
# listeners already defined - named service.gateway.publishSectionName /
# retSectionName - for these TCPRoutes to attach to.
{{- if .Values.service.gateway.enabled }}
{{- if not .Values.service.gateway.gatewayName }}
{{- fail "service.gateway.gatewayName is required when service.gateway.enabled is true." }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: salt-master-publish
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: salt-master
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  parentRefs:
    - name: {{ .Values.service.gateway.gatewayName }}
      namespace: {{ .Values.service.gateway.gatewayNamespace | default .Values.namespace }}
      sectionName: {{ .Values.service.gateway.publishSectionName }}
  rules:
    - backendRefs:
        - name: salt-master
          port: 4505
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: salt-master-ret
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: salt-master
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  parentRefs:
    - name: {{ .Values.service.gateway.gatewayName }}
      namespace: {{ .Values.service.gateway.gatewayNamespace | default .Values.namespace }}
      sectionName: {{ .Values.service.gateway.retSectionName }}
  rules:
    - backendRefs:
        - name: salt-master
          port: 4506
{{- end }}
