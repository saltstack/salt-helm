apiVersion: v2
name: salt-master
description: >-
  Installs a Salt master as a Kubernetes Deployment. Exposes the master
  via a flat Service and optionally per‑ordinal Services for external
  minion access. Supports trusted‑minion integration with the
  salt‑key‑operator side‑car. Does not provide multi‑master scaling.
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - salt
  - saltstack
  - kubernetes
maintainers:
  - name: salt-compliance-team

dependencies:
  - name: salt-key-operator
    version: ">=0.0.0"
    repository: "file://../salt-key-operator"
