{{- if eq .Values.workload.kind "StatefulSet" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "salt-minion-vcf.fullname" . }}
  labels:
    {{- include "salt-minion-vcf.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "salt-minion-vcf.selectorLabels" . | nindent 4 }}
{{- end }}
