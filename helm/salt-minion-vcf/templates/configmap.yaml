apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "salt-minion-vcf.fullname" . }}-config
  labels:
    {{- include "salt-minion-vcf.labels" . | nindent 4 }}
data:
  10-master.conf: |
    {{- if kindIs "slice" .Values.salt.master }}
    # Salt's native multi-master mode: one independent, simultaneous
    # connection per address, not failover - see
    # https://docs.saltproject.io/en/3006/topics/tutorials/multimaster.html
    master:
      {{- range .Values.salt.master }}
      - {{ . | quote }}
      {{- end }}
    {{- else }}
    master: {{ .Values.salt.master | quote }}
    {{- end }}
    master_port: {{ .Values.salt.masterPort }}
    publish_port: {{ .Values.salt.publishPort }}
    master_tries: {{ .Values.salt.masterTries }}
    retry_dns: {{ .Values.salt.retryDns }}
    auth_timeout: {{ .Values.salt.authTimeout }}
    master_alive_interval: {{ .Values.salt.masterAliveInterval }}
    recon_default: {{ .Values.salt.reconDefault }}
    recon_max: {{ .Values.salt.reconMax }}
    recon_randomize: {{ .Values.salt.reconRandomize }}
    {{- if .Values.salt.masterFinger }}
    master_finger: {{ .Values.salt.masterFinger | quote }}
    {{- end }}
    {{- with .Values.salt.extraMinionConfig }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
